name: CI / CD — Haile Resort Hawassa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Test & lint backend
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-ci:
    name: Backend — Install & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if [ -f ".eslintrc*" ] || grep -q '"eslint"' package.json; then
            npx eslint . --ext .js --max-warnings 0
          else
            echo "No ESLint config — skipping"
          fi

      - name: Run tests
        run: |
          if grep -qE '"jest"|"mocha"|"vitest"' package.json; then
            npm test -- --forceExit
          else
            echo "No test runner found — skipping"
          fi
        env:
          NODE_ENV: test

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Build frontend (validates the React build succeeds)
# ─────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: false   # treat warnings as warnings, not errors
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_HOTEL_NAME: Haile Resort Hawassa

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Deploy backend to Render  (main branch only)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://haile-hotel-and-resorts.onrender.com

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --silent --show-error --fail -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Render backend deploy triggered"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Deploy frontend to Netlify  (main branch only)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Netlify
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://haileresort.netlify.app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend
        env:
          CI: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_HOTEL_NAME: Haile Resort Hawassa

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: frontend/build
          production-branch: main
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
